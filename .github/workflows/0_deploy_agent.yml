name: "0_Deploy_Agent"
run-name: Deploy_Agents_-_${{ inputs.branch || 'main' }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'wonderWhy branch to build/test/deploy'
        required: true
        type: string
        default: main

jobs:
  # Lint, typecheck and test ONCE. Each deploy below only builds and ships its
  # agent. No build output is stored as a run artifact (public repo).
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      agents: ${{ steps.agents.outputs.agents }}
    steps:
      - name: Check out agents/ folder
        uses: actions/checkout@v5
        with:
          repository: WonderWhyDev/wonderWhy
          token: ${{ secrets.REPO_READ_TOKEN }}
          path: wonderWhy
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          sparse-checkout: 'agents'
          sparse-checkout-cone-mode: false

      - id: version
        working-directory: wonderWhy
        run: |
          version=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ inputs.branch }} to $version"

      # The one list of deployed agents. Add a new agent here once its Lambda
      # exists and it has fixtures/smoke/<agent>.json + .jq.
      - id: agents
        run: echo 'agents=["detect-lat-long","gps-visits"]' >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('wonderWhy/agents/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: wonderWhy/agents
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: wonderWhy/agents
        run: bun run lint

      - name: Typecheck
        working-directory: wonderWhy/agents
        run: bunx tsc --noEmit

      - name: Unit + golden tests
        working-directory: wonderWhy/agents
        run: bun test

      - name: Every agent has smoke fixtures
        working-directory: wonderWhy/agents
        run: |
          for agent in $(echo '${{ steps.agents.outputs.agents }}' | jq -r '.[]'); do
            test -f "fixtures/smoke/$agent.json" && test -f "fixtures/smoke/$agent.jq"
          done

  deploy_qa:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.verify.outputs.agents) }}
    uses: ./.github/workflows/x_deploy_base_agent.yml
    with:
      versionToBuild: ${{ needs.verify.outputs.version }}
      environment: qa
      agent: ${{ matrix.agent }}
      functionName: wondermove-agent-${{ matrix.agent }}
      artifactBucket: test1-v4.wondermove.in
    secrets:
      REPO_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

  # Prod starts only when every agent passed QA.
  deploy_prod:
    needs: [verify, deploy_qa]
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.verify.outputs.agents) }}
    uses: ./.github/workflows/x_deploy_base_agent.yml
    with:
      versionToBuild: ${{ needs.verify.outputs.version }}
      environment: magnum
      agent: ${{ matrix.agent }}
      functionName: wondermove-agent-${{ matrix.agent }}
      artifactBucket: magnum.ap-south-1
    secrets:
      REPO_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
