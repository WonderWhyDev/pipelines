name: "0_Web_Pipeline"
run-name: Web_Pipeline_-_${{ inputs.branch || 'main' }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'wonderWhy branch to build/test/deploy'
        required: true
        type: string
        default: main
  # 1_Branch_Check calls this with tests_only: true, so only the test jobs run.
  # A manual run has no tests_only input, and !null is true, so it deploys as before.
  workflow_call:
    inputs:
      branch:
        description: 'wonderWhy commit or branch to test'
        required: true
        type: string
      tests_only:
        description: 'Skip every deploy job'
        type: boolean
        default: false
      skip_e2e:
        description: 'Skip the web E2E journey (the caller runs it once itself)'
        type: boolean
        default: false
      # 1_Branch_Check's plan: lint:<app>, unit (the unit tests and the coverage
      # gate). A changed patrol_test file needs only its app's lint here.
      only:
        description: 'Space-separated jobs to run; empty = all'
        type: string
        default: ''

jobs:
  find_latest_version:
    runs-on: ubuntu-latest
    outputs:
      latest_version: ${{ steps.get_version.outputs.latest_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: WonderWhyDev/wonderWhy
          token: ${{ secrets.REPO_READ_TOKEN }}
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 1
          sparse-checkout: '.gitignore'
          sparse-checkout-cone-mode: false
      - id: get_version
        run: |
          latest_version=$(git log -1 --format=%H)
          echo "latest_version=$latest_version" >> $GITHUB_OUTPUT
          echo "Resolved ${{ inputs.branch || 'main' }} to $latest_version"

  lint:
    needs: find_latest_version
    if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' lint:') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [wondermove_web, wondermake_web]
        # With an only list, an app's lint runs only when it names lint:<app>.
        # An exclude value that matches no app ('-') drops nothing.
        exclude:
          - app: ${{ (!inputs.only || contains(format(' {0} ', inputs.only), ' lint:wondermove_web ')) && '-' || 'wondermove_web' }}
          - app: ${{ (!inputs.only || contains(format(' {0} ', inputs.only), ' lint:wondermake_web ')) && '-' || 'wondermake_web' }}
    name: Lint (${{ matrix.app }})
    steps:
      - uses: actions/checkout@v5
        with:
          repository: WonderWhyDev/wonderWhy
          token: ${{ secrets.REPO_READ_TOKEN }}
          fetch-depth: 1
          ref: ${{ needs.find_latest_version.outputs.latest_version }}

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Install dependencies
        run: |
          cd flutter/packages/auth_core && dart pub get
          cd ../auth_flutter && flutter pub get
          cd ../../apps/${{ matrix.app }} && flutter pub get

      - name: Check formatting
        run: |
          cd flutter/apps/${{ matrix.app }}
          dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: |
          cd flutter/apps/${{ matrix.app }}
          flutter analyze

      - name: Check test mocking (HTTP-level only, no state-level mocks)
        run: |
          cd flutter/packages/test_lints && dart pub get
          dart run bin/check.dart ../../apps/${{ matrix.app }}/test

      # Page-chrome tokens (docs/uniform-frontend). Same tool and package as the
      # check above, pointed at lib/features instead of test/.
      #
      # Gated by a committed per-rule baseline that may only shrink, so existing
      # drift does not block CI but no new raw color/spacing/radius or
      # viewport-fraction sizing can be added. Deliberately per-rule rather than
      # one global budget: a single number fails on unrelated correct code once
      # the repo sits exactly at the limit.
      #
      # Regenerate after a burn-down:
      #   cd flutter/apps/<app>
      #   dart run ../../packages/test_lints/bin/page_chrome_check.dart \
      #     lib/features --baseline page_chrome_baseline.txt --write-baseline
      - name: Check page chrome tokens
        run: |
          cd flutter/apps/${{ matrix.app }}
          if [ -f page_chrome_baseline.txt ]; then
            LEDGER=""
            # chrome_debt.txt gates screen_must_return_app_page: screens listed
            # there may still skip AppPage. The list may only shrink, so an
            # unmigrated NEW screen fails CI by name rather than by a number.
            if [ -f chrome_debt.txt ]; then
              LEDGER="--ledger chrome_debt.txt"
            fi
            dart run ../../packages/test_lints/bin/page_chrome_check.dart \
              lib/features --baseline page_chrome_baseline.txt $LEDGER
          else
            echo "No page_chrome_baseline.txt for ${{ matrix.app }} — skipping."
          fi

      # Epoch / time zone rules (docs/epoch/convention.md). Same package as the
      # two checks above, pointed at lib/.
      #
      # A picked date becomes an epoch only through dateTimeToIstEpoch, and an
      # epoch becomes a date only through the date_utils helpers. Raw
      # millisecondsSinceEpoch / fromMillisecondsSinceEpoch use the device zone,
      # which only looks right because every device is in IST.
      #
      # Gated by a committed per-file baseline that may only shrink, so existing
      # conversions do not block CI but a new one fails and names the line.
      #
      # Regenerate after a burn-down:
      #   cd flutter/apps/<app>
      #   dart run ../../packages/test_lints/bin/epoch_check.dart \
      #     lib --baseline epoch_baseline.txt --write-baseline
      - name: Check epoch / time zone rules
        run: |
          cd flutter/apps/${{ matrix.app }}
          dart run ../../packages/test_lints/bin/epoch_check.dart \
            lib --baseline epoch_baseline.txt

  unit_test:
    needs: find_latest_version
    if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' unit ') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: wondermake_web
            coverage_cmd: './scripts/coverage.sh'
    name: Unit Test (${{ matrix.app }})
    steps:
      - uses: actions/checkout@v5
        with:
          repository: WonderWhyDev/wonderWhy
          token: ${{ secrets.REPO_READ_TOKEN }}
          fetch-depth: 1
          ref: ${{ needs.find_latest_version.outputs.latest_version }}

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Install dependencies
        run: |
          cd flutter/packages/auth_core && dart pub get
          cd ../auth_flutter && flutter pub get
          cd ../../apps/${{ matrix.app }} && flutter pub get

      - name: Install lcov
        # The Ubuntu mirrors fail now and then (11 Nov: DNS errors, a 35 min
        # hang, then red). Short tries with a fresh package index instead.
        timeout-minutes: 10
        run: |
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            sudo apt-get install -y -q $APT_OPTS lcov && exit 0
            [ "$try" -lt 3 ] || exit 1
            echo "::warning::lcov install failed (try $try of 3); refreshing the package index"
            sudo apt-get update -q $APT_OPTS || true
            sleep $((try * 15))
          done

      - name: Run tests with coverage
        run: |
          cd flutter/apps/${{ matrix.app }}
          ${{ matrix.coverage_cmd }}

  # wondermove_web's suite is large, so it runs as parallel shards (one runner
  # each) that each emit a partial lcov. coverage_wondermove merges those
  # partials and runs the single global coverage gate.
  #
  # Test files are split evenly by path (shard N takes every 7th file), so new
  # tests spread over all shards. flutter test compiles one test file at a
  # time and writes the whole app for each (~2 s per file here), so a shard's
  # time follows its file count. scripts/test_shard.sh (wonderWhy) also bundles
  # the shard into one test file per core, so flutter compiles 4 times instead
  # of ~200. Commits from before that script fall back to the plain even split.
  # To change the shard count, edit the list; the total follows it.
  unit_test_wondermove:
    needs: find_latest_version
    if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' unit ') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    name: Unit Test wondermove (${{ matrix.shard }}/${{ strategy.job-total }})
    steps:
      - uses: actions/checkout@v5
        with:
          repository: WonderWhyDev/wonderWhy
          token: ${{ secrets.REPO_READ_TOKEN }}
          fetch-depth: 1
          ref: ${{ needs.find_latest_version.outputs.latest_version }}

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Install dependencies
        run: |
          cd flutter/packages/auth_core && dart pub get
          cd ../auth_flutter && flutter pub get
          cd ../../apps/wondermove_web && flutter pub get

      - name: Run shard tests with coverage
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          # pipefail: a flutter test failure the reporter misses still fails.
          set -o pipefail
          cd flutter/apps/wondermove_web
          if [ -x scripts/test_shard.sh ]; then
            scripts/test_shard.sh "$SHARD" "$SHARDS"
          else
            # Device tests in test/integration_test never ran here.
            FILES=$(find test -name '*_test.dart' -not -path 'test/integration_test/*' \
              | LC_ALL=C sort | awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i - 1')
            echo "Shard $SHARD/$SHARDS: $(echo "$FILES" | wc -l) test files"
            # shellcheck disable=SC2086 # one path per word
            flutter test $FILES \
              --coverage \
              --concurrency="$(nproc)" \
              --reporter=json | python3 scripts/test_reporter.py
          fi

      - name: Upload coverage shard
        uses: actions/upload-artifact@v4
        with:
          name: wm-coverage-${{ matrix.shard }}
          path: flutter/apps/wondermove_web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  coverage_wondermove:
    needs: [find_latest_version, unit_test_wondermove]
    if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' unit ') }}
    runs-on: ubuntu-latest
    name: Coverage Gate (wondermove_web)
    steps:
      - uses: actions/checkout@v5
        with:
          repository: WonderWhyDev/wonderWhy
          token: ${{ secrets.REPO_READ_TOKEN }}
          fetch-depth: 1
          ref: ${{ needs.find_latest_version.outputs.latest_version }}

      - name: Install lcov
        # The Ubuntu mirrors fail now and then (11 Nov: DNS errors, a 35 min
        # hang, then red). Short tries with a fresh package index instead.
        timeout-minutes: 10
        run: |
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            sudo apt-get install -y -q $APT_OPTS lcov && exit 0
            [ "$try" -lt 3 ] || exit 1
            echo "::warning::lcov install failed (try $try of 3); refreshing the package index"
            sudo apt-get update -q $APT_OPTS || true
            sleep $((try * 15))
          done

      - name: Download coverage shards
        uses: actions/download-artifact@v4
        with:
          path: coverage-shards
          pattern: wm-coverage-*

      - name: Merge shards and check coverage threshold
        run: |
          cd flutter/apps/wondermove_web
          mkdir -p coverage
          ADD=()
          for f in "$GITHUB_WORKSPACE"/coverage-shards/*/lcov.info; do
            ADD+=(-a "$f")
          done
          echo "Merging ${#ADD[@]} shard files into coverage/lcov.info"
          lcov "${ADD[@]}" -o coverage/lcov.info --ignore-errors inconsistent
          bash coverage.sh --gate-only

  # Hard gate before prod: the full driver-advance journey (real UI, real backend,
  # offline OCR/HDFC mocks) on the exact commit being promoted. Starts right off
  # find_latest_version so it runs in parallel with lint, the unit tests, the
  # coverage gate and the QA deploy — it does not wait for lint; a red journey
  # blocks deploy_prod (QA still deploys).
  e2e_journey:
    needs: [find_latest_version]
    if: ${{ !inputs.skip_e2e }}
    uses: ./.github/workflows/web_e2e_journey.yml
    with:
      ref: ${{ needs.find_latest_version.outputs.latest_version }}
    secrets:
      REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
      GHRC_SECRET_KEY: ${{ secrets.GHRC_SECRET_KEY }}

  deploy_qa:
    needs: [find_latest_version, lint, unit_test, coverage_wondermove]
    if: ${{ !inputs.tests_only }}
    uses: ./.github/workflows/x_deploy_base_web.yml
    with:
      versionToBuild: ${{ needs.find_latest_version.outputs.latest_version }}
      environment: qa
    secrets:
      REPO_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
      EC2_IP: ${{ secrets.EC2_IP }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_USER: ${{ secrets.EC2_USER }}
      SECURITY_GROUP_ID: ${{ secrets.SECURITY_GROUP_ID }}
      SSH_PRIVATE_KEY_FOR_EC2: ${{ secrets.SSH_PRIVATE_KEY_FOR_EC2 }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OAUTH_MOBILE_APP_CLIENT_ID: ${{ secrets.OAUTH_MOBILE_APP_CLIENT_ID }}

  deploy_prod:
    needs: [find_latest_version, deploy_qa, e2e_journey]
    if: ${{ !inputs.tests_only }}
    uses: ./.github/workflows/x_deploy_base_web.yml
    with:
      versionToBuild: ${{ needs.find_latest_version.outputs.latest_version }}
      environment: magnum
    secrets:
      REPO_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
      EC2_IP: ${{ secrets.EC2_IP }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_USER: ${{ secrets.EC2_USER }}
      SECURITY_GROUP_ID: ${{ secrets.SECURITY_GROUP_ID }}
      SSH_PRIVATE_KEY_FOR_EC2: ${{ secrets.SSH_PRIVATE_KEY_FOR_EC2 }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OAUTH_MOBILE_APP_CLIENT_ID: ${{ secrets.OAUTH_MOBILE_APP_CLIENT_ID }}
