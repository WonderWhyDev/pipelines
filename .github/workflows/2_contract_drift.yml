name: "2_Contract_Drift"
run-name: Contract_Drift_-_${{ inputs.branch || 'main' }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'wonderWhy branch to check'
        required: true
        type: string
        default: main
  schedule:
    - cron: "30 15 * * 1-6"

jobs:
  Contract_Drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: WonderWhyDev/wonderWhy
          token: ${{ secrets.REPO_READ_TOKEN }}
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'

      # Node stays the runtime; bun installs. check-drift.sh runs the route
      # enumerator out of backend/ via vite-node on Node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('backend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Install dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      # Regenerates the OpenAPI spec from the backend routes and the Dart
      # api_client from the spec, then fails if either differs from what is
      # committed. See contract/README.md.
      - name: Check contract drift
        run: bash contract/check-drift.sh
