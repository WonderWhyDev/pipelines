name: "9_Cleanup_Runs"
run-name: Cleanup_Workflow_Runs

# Per workflow: always keep the latest keep_minimum_runs SUCCESSFUL runs, and
# delete every other completed run older than retain_days (weekly).
# Daily: delete the 1_Branch_Check runs of wonderWhy branches that are gone.
on:
  schedule:
    - cron: "17 3 * * 0"
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      retain_days:
        description: "Delete runs older than this many days"
        default: "30"
      keep_minimum_runs:
        description: "Always keep this many latest successful runs per workflow"
        default: "10"
      dry_run:
        description: "List only, delete nothing"
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    # Weekly only: the daily schedule is for branch_check_runs below.
    if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * 0'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RETAIN_DAYS: ${{ inputs.retain_days || '30' }}
      KEEP_MIN: ${{ inputs.keep_minimum_runs || '10' }}
      # Scheduled runs delete for real; manual runs default to a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Delete old runs, keep latest successes
        run: |
          cutoff=$(date -u -d "-${RETAIN_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "cutoff=$cutoff keep_min=$KEEP_MIN dry_run=$DRY_RUN"
          for wf in $(gh api --paginate "repos/$REPO/actions/workflows?per_page=100" --jq '.workflows[].id'); do
            runs=$(gh api --paginate "repos/$REPO/actions/workflows/$wf/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status=="completed") | [.id, .conclusion, .created_at] | @tsv' \
              | sort -t$'\t' -k3,3r)
            keep=$(echo "$runs" | awk -F'\t' '$2=="success"{print $1}' | head -n "$KEEP_MIN")
            echo "$runs" | while IFS=$'\t' read -r id conclusion created; do
              [ -z "$id" ] && continue
              [[ "$created" > "$cutoff" ]] && continue
              echo "$keep" | grep -qx "$id" && continue
              if [ "$DRY_RUN" = "true" ]; then
                echo "would delete workflow=$wf run=$id ($conclusion, $created)"
              else
                gh api -X DELETE "repos/$REPO/actions/runs/$id" && echo "deleted run=$id"
              fi
            done
          done

  # A Branch_Check run is named Branch_Check_-_<branch>. Once that wonderWhy
  # branch is deleted (ww-land.sh cleanup does it after the commit is on main),
  # its runs are noise.
  branch_check_runs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WW_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Delete Branch_Check runs whose branch is gone
        run: |
          branches=$(GH_TOKEN="$WW_TOKEN" gh api --paginate repos/WonderWhyDev/wonderWhy/branches --jq '.[].name')
          if [ -z "$branches" ]; then
            echo "::error::could not list the wonderWhy branches; nothing deleted"
            exit 1
          fi
          gh api --paginate "repos/$REPO/actions/workflows/1_branch_check.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, .display_title] | @tsv' |
            while IFS=$'\t' read -r id title; do
              branch=${title#Branch_Check_-_}
              [ "$branch" != "$title" ] || continue
              printf '%s\n' "$branches" | grep -qxF -- "$branch" && continue
              if [ "$DRY_RUN" = "true" ]; then
                echo "would delete run=$id (branch $branch is gone)"
              else
                gh api -X DELETE "repos/$REPO/actions/runs/$id" && echo "deleted run=$id (branch $branch is gone)"
              fi
            done
