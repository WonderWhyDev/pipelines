name: "9_Copy_Secrets_To_WonderWhy"
run-name: Copy_Secrets_To_WonderWhy

# One-off: copies the deploy secrets of this repo's qa and magnum environments
# into the wonderWhy repo's qa and prod environments. Needs the repo secret
# WONDERWHY_ADMIN_TOKEN (a token that can set secrets on wonderWhy); the
# wonderWhy copy_secrets.sh script sets it and removes it after the run.
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: ${{ matrix.from }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - from: qa
            to: qa
          - from: magnum
            to: prod
    steps:
      - name: Copy secrets
        env:
          GH_TOKEN: ${{ secrets.WONDERWHY_ADMIN_TOKEN }}
          TARGET_ENV: ${{ matrix.to }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_IP: ${{ secrets.EC2_IP }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SECURITY_GROUP_ID: ${{ secrets.SECURITY_GROUP_ID }}
          SSH_PRIVATE_KEY_FOR_EC2: ${{ secrets.SSH_PRIVATE_KEY_FOR_EC2 }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
          KEYSTORE_HASH_KEY: ${{ secrets.KEYSTORE_HASH_KEY }}
        run: |
          set -e
          gh api -X PUT repos/WonderWhyDev/wonderWhy/environments/"$TARGET_ENV" > /dev/null
          for NAME in AWS_ACCESS_KEY AWS_SECRET_KEY AWS_REGION EC2_IP EC2_USER SECURITY_GROUP_ID SSH_PRIVATE_KEY_FOR_EC2 DOMAIN_NAME BASE_DOMAIN KEYSTORE_HASH_KEY; do
            if [ -z "${!NAME}" ]; then
              echo "SKIP $NAME: empty in ${{ matrix.from }}"
              continue
            fi
            printf '%s' "${!NAME}" | gh secret set "$NAME" --env "$TARGET_ENV" -R WonderWhyDev/wonderWhy
            echo "SET  $NAME -> wonderWhy/$TARGET_ENV"
          done
