# Driver-advance journey + operations dashboard + vehicle-attendance + No Driver
# + driver onboarding + container trips (detachable + attached) +
# transporter/fuel bills + transporter portal + lease vehicle + trading +
# WonderMake E2E, run as 11 parallel matrix legs (one per Patrol suite), each
# against its own isolated docker-compose stack.
#
# Plus the suites (job suites at the end): one leg per "leg" named in
# wonderWhy's functional-test/suites/*.json, found at run time, so a new suite
# needs no edit here.
#
# The journey legs and their settings live in .github/legs/web_journeys.json.
# The plan job picks the legs: all of them, or only the ones the "only" input
# names (1_Branch_Check passes the legs a branch's changes use).
#
# The driver-advance leg's journey (OCR + HDFC payout) runs without touching a
# real external provider: a single dummy mock-server container fakes both. See
# functional-test/mock_server in the wonderWhy repo. The WonderMake leg uses the
# same overlay for its delivery-bill OCR. The operations-dashboard
# and vehicle-attendance legs are read-only UI suites, and the No Driver leg
# (Mark No Driver, Assign Driver, pre-trip advance, retire) and the trading leg
# (sales bills and their trips) write only through the backend; none of the four
# touches OCR/HDFC/S3/GSTZen, so they skip that overlay entirely.
#
# This workflow lives in the pipelines repo but all the code/compose lives in
# the wonderWhy monorepo, so it checks THAT out (like 0_web_pipeline.yml does).
#
# Each leg gets its own compose project (its own db/backend/kratos/nginx), so
# there's no cross-leg data collision. Before this split, operations_dashboard_test
# and vehicle_attendance_test had to run strictly sequentially on ONE shared
# stack, because both seed the same platform_management master tenant and both
# call the tenant-wide resetTripData() — whichever ran second would wipe the
# other's trip fixtures mid-run. Isolating each leg on its own stack removes
# that constraint entirely.
#
# The driver-advance leg additionally runs a hard GATE before its Patrol run:
# `dart test test/mock/` — the HDFC payout through the real backend adapter ->
# mock -> CBX reference (mTLS + JOSE), the proven offline-integration proof.
# It only gates the driver-advance leg — with fail-fast off, a GATE failure no
# longer blocks the other two (unrelated) suites from running.

name: Web E2E Journey (offline mock)

# Callable as a gate from 0_backend_pipeline.yml / 0_web_pipeline.yml (which pass the
# resolved SHA so the journey validates the exact commit being promoted), and still
# runnable by hand (type a branch name).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "wonderWhy branch or SHA to test"
        required: false
        type: string
        default: main
      only:
        description: 'Legs to run, e.g. "journey:lease suite:toll_gst"; journey:* or suite:* for all of a kind; empty = every leg'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: "wonderWhy branch or SHA to test"
        required: true
        type: string
      only:
        description: 'Legs to run, e.g. "journey:lease suite:toll_gst"; empty = every leg'
        required: false
        type: string
        default: ''
    secrets:
      REPO_READ_TOKEN:
        required: true
      GHRC_SECRET_KEY:
        required: true

jobs:
  # Which legs run: every journey in .github/legs/web_journeys.json and every
  # web suite leg (functional-test/suites/*.json, grouped by
  # .github/actions/e2e_suites), or only the ones the "only" input names.
  plan:
    name: Web E2E (plan)
    runs-on: ubuntu-latest
    outputs:
      journeys: ${{ steps.journeys.outputs.legs }}
      has_journeys: ${{ steps.journeys.outputs.has_legs }}
      legs: ${{ steps.legs.outputs.legs }}
      has_legs: ${{ steps.legs.outputs.has_legs }}
    steps:
      - name: Check out pipelines repo for actions
        uses: actions/checkout@v5

      - name: Pick the journeys
        id: journeys
        uses: ./.github/actions/pick_legs
        with:
          legs_file: .github/legs/web_journeys.json
          unit: journey
          only: ${{ inputs.only }}

      - name: Check out the suite files
        uses: actions/checkout@v5
        with:
          repository: WonderWhyDev/wonderWhy
          token: ${{ secrets.REPO_READ_TOKEN }}
          ref: ${{ inputs.ref || 'main' }}
          path: wonderWhy
          fetch-depth: 1
          sparse-checkout: functional-test/suites

      - name: Group the web suites into legs
        id: legs
        uses: ./.github/actions/e2e_suites
        with:
          suites_dir: wonderWhy/functional-test/suites
          app: web
          only: ${{ inputs.only }}

  journey:
    needs: plan
    if: needs.plan.outputs.has_journeys == 'true'
    # Pinned to 24.04: ubuntu-latest moved to 26.04, and playwright 1.56.0
    # (bundled by patrol 4.9.0) refuses to install chromium there ("does not
    # support chromium on ubuntu26.04-x64", run 40855901008). Playwright 1.61+
    # supports 26.04, but no patrol release bundles it yet (4.10.0 is still on
    # 1.56.0). Revisit when leancodepl/patrol#3319 (playwright 1.64.1) ships.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # One leg per entry in .github/legs/web_journeys.json that the plan
        # picked. video: Playwright recording mode per leg, uploaded as
        # <name>-video: off | on | retain-on-failure | on-first-retry. gate: a
        # functional-test folder of Dart tests that must pass before the Patrol
        # run (driver_advance's offline HDFC mock system test).
        include: ${{ fromJSON(needs.plan.outputs.journeys) }}
    name: Web E2E Journey (${{ matrix.name }})
    env:
      COMPOSE_FILES: >-
        ${{ matrix.needs_mock && '-f compose.yml -f compose.local.yml -f compose.mock.yml'
                               || '-f compose.yml -f compose.local.yml' }}
      # Unique per leg even though each matrix leg already runs on its own
      # runner VM -- keeps docker compose ps/logs unambiguous and matches the
      # per-worktree SESSION naming convention already used locally.
      PROJECT: journey-${{ matrix.name }}
      # compose.local.yml publishes nginx on ${WEB_PORT} and requires it to be set,
      # so that a developer box cannot silently grab the shared host port. A CI
      # runner is single-tenant, so 80 is both free and what the app expects: the
      # Patrol app under --dart-define=E2E=true strips its own port to find nginx.
      WEB_PORT: 80
      # compose.local.yml also publishes db's port (default 15432) -- functional-test
      # runs on the runner now (see below) and connects to Postgres directly.
      DB_PORT: 15432
    steps:
      - name: Checkout wonderWhy (code + compose live here)
        uses: actions/checkout@v5
        with:
          repository: WonderWhyDev/wonderWhy
          token: ${{ secrets.REPO_READ_TOKEN }}
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      # Flutter bundles Dart, which is all functional-test (pure Dart, no
      # Flutter dependency) needs -- it now runs directly on the runner instead
      # of inside the functional-test container. No separate Dart SDK install.

      # Stays on 22 while the rest of CI runs 26.8.1. This runner's node is used
      # for exactly one thing - `npx playwright install` below - and playwright
      # 1.56.0 hangs forever unpacking chromium-linux.zip under node 26 (download
      # reaches 100%, the extract never completes, the job burns its full timeout).
      # The containers this workflow drives run their own node 26; the runner's
      # version has no bearing on them. Revisit when patrol ships a playwright
      # that supports node 26.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate Patrol CLI
        # Pin to the CLI that matches the app's patrol package (4.9.0). The CLI
        # validates the package against a compatibility table it ships: 4.7.0+
        # pairs with patrol 4.9.0+, while the older 4.4.0 pin rejects it.
        run: dart pub global activate patrol_cli 4.7.0

      - name: Bring up offline-mock stack
        if: matrix.needs_mock
        run: |
          docker compose $COMPOSE_FILES -p $PROJECT up -d --wait db localstack mailpit
          docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
            awslocal sqs create-queue --queue-name margin
          docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
            awslocal sqs create-queue --queue-name gl_posting_dlq.fifo --attributes FifoQueue=true
          docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
            awslocal sqs create-queue --queue-name gl_posting.fifo \
            --attributes FifoQueue=true,DeduplicationScope=messageGroup,FifoThroughputLimit=perMessageGroupId
          docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
            awslocal s3 mb s3://localbucket
          docker compose $COMPOSE_FILES -p $PROJECT up -d --build \
            kratos backend mock-server nginx

      # operations_dashboard_test / vehicle_attendance_test / no_driver_test /
      # trading_test never touch OCR, SurePass or S3 -- same lean stack their own
      # `make operations-host` / `make vehicle-attendance-host` /
      # `make no-driver-host` / `make trading-host` targets use.
      - name: Bring up backend stack (no mock overlay)
        if: ${{ !matrix.needs_mock }}
        run: |
          docker compose $COMPOSE_FILES -p $PROJECT up -d --wait db localstack
          docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
            awslocal sqs create-queue --queue-name margin
          docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
            awslocal sqs create-queue --queue-name gl_posting_dlq.fifo --attributes FifoQueue=true
          docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
            awslocal sqs create-queue --queue-name gl_posting.fifo \
            --attributes FifoQueue=true,DeduplicationScope=messageGroup,FifoThroughputLimit=perMessageGroupId
          docker compose $COMPOSE_FILES -p $PROJECT up -d --build \
            kratos backend nginx

      # functional-test runs on the runner now (pure Dart -- Flutter's bundled
      # Dart above is enough), reaching backend/kratos through nginx's WEB_PORT
      # and `db` through its published DB_PORT, instead of a docker exec into a
      # functional-test container.
      - name: Wait for backend
        working-directory: functional-test
        env:
          BACKEND_URL: http://localhost:${{ env.WEB_PORT }}/api
        run: ./bin/wait-for-backend.sh

      # The No Driver seed names its trucks and drivers after ND_RUN (the run's
      # start epoch, not a counter: the seed dates its trips from it) and the
      # Patrol test rebuilds the same names from it, so both read this one value.
      # MK_RUN does the same for the WonderMake items, teams and projects, and
      # TR_RUN for the trading branch, masters, series prefix and vehicles, and
      # TB_RUN for the bill journey's transporter, truck, bunk and cash account,
      # and TP_RUN for the portal journey's transporter, its login, trucks and
      # cash account, and LV_RUN for the lease journey's owner, its login, truck,
      # driver and cash account, and DO_RUN for the driver onboarding journey's
      # drivers and its operations head login, and CT_RUN and MH_RUN for the
      # container trip leg's detachable lane, driver and trucks and its monthly
      # hire company and attached trucks. The other legs ignore all nine.
      - name: Fix the run id (ND_RUN, MK_RUN, TR_RUN, TB_RUN, TP_RUN, LV_RUN, DO_RUN, CT_RUN, MH_RUN)
        run: |
          RUN=$(date +%s)
          echo "ND_RUN=$RUN" >> "$GITHUB_ENV"
          echo "MK_RUN=$RUN" >> "$GITHUB_ENV"
          echo "TR_RUN=$RUN" >> "$GITHUB_ENV"
          echo "TB_RUN=$RUN" >> "$GITHUB_ENV"
          echo "TP_RUN=$RUN" >> "$GITHUB_ENV"
          echo "LV_RUN=$RUN" >> "$GITHUB_ENV"
          echo "DO_RUN=$RUN" >> "$GITHUB_ENV"
          echo "CT_RUN=$RUN" >> "$GITHUB_ENV"
          echo "MH_RUN=$RUN" >> "$GITHUB_ENV"

      # Each seed_*.dart commits all its work, prints the completion marker, then
      # hangs (the Dart VM doesn't exit — a lingering client keeps the loop alive).
      # Stream it, proceed the instant the marker appears, then kill the leftover
      # process. No fixed idle wait; the step's verdict is the marker.
      - name: Seed fixtures (${{ matrix.name }})
        working-directory: functional-test
        env:
          BACKEND_URL: http://localhost:${{ env.WEB_PORT }}/api
          KRATOS_ADMIN_URL: http://localhost:${{ env.WEB_PORT }}/auth/api/admin
          KRATOS_PUBLIC_URL: http://localhost:${{ env.WEB_PORT }}/auth/api/public
          DB_HOST: localhost
        run: |
          set +e
          dart pub get && ${{ matrix.seed_cmd }} > /tmp/seed.log 2>&1 &
          EXEC_PID=$!
          for i in $(seq 1 120); do
            grep -q "${{ matrix.seed_marker }}" /tmp/seed.log && break
            kill -0 "$EXEC_PID" 2>/dev/null || break
            sleep 2
          done
          cat /tmp/seed.log
          kill "$EXEC_PID" 2>/dev/null
          pkill -f 'tool/seed_' 2>/dev/null || true
          grep -q "${{ matrix.seed_marker }}" /tmp/seed.log

      - name: GATE — offline HDFC mock system test
        if: matrix.gate
        working-directory: functional-test
        env:
          BACKEND_URL: http://localhost:${{ env.WEB_PORT }}/api
          KRATOS_ADMIN_URL: http://localhost:${{ env.WEB_PORT }}/auth/api/admin
          KRATOS_PUBLIC_URL: http://localhost:${{ env.WEB_PORT }}/auth/api/public
          DB_HOST: localhost
        run: dart test --file-reporter=json:testReports/results.json ${{ matrix.gate }}

      # continue-on-error: this suite is a small extra on top of the blocking
      # Patrol journey below it — a bug in the report generator must never abort
      # the job before the actual journey run.
      - name: Generate HDFC mock gate report
        if: always() && matrix.gate
        continue-on-error: true
        working-directory: functional-test
        run: python3 scripts/gen_test_report.py

      - name: Upload HDFC mock gate report
        if: always() && matrix.gate
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hdfc-mock-gate-report
          path: functional-test/testReports/report.html
          if-no-files-found: warn

      # Pin to the Playwright version patrol's web_runner bundles (patrol 4.9.0 ->
      # playwright 1.56.0). Installing the matching browser here makes patrol's
      # own `npx playwright install` a cached no-op instead of failing.
      # No --with-deps: the runner image already has all 21 libraries chromium
      # needs. The flag only added CJK/Thai/X11 font packages, which Flutter web
      # never uses (it draws text with its own fonts), and their apt download
      # once crawled past the 10-minute cap (run 40279657924, trading leg).
      # timeout: this install is ~30s of download plus a few seconds of unpack.
      # Capped so a repeat of the node-26 unpack hang fails here in minutes
      # instead of silently eating the whole job budget.
      - name: Install Playwright Chromium (match patrol web_runner)
        timeout-minutes: 10
        run: npx --yes playwright@1.56.0 install chromium

      # Blocking: each leg's own Patrol suite, driven end to end against its own
      # isolated stack. The payout step's payable + beneficiary (driver_advance
      # leg only) are seeded by seed_journey.dart.
      # --lang=en-US: headless chromium otherwise exposes an empty/malformed
      # navigator.languages, and Flutter's engine init throws "Incorrect locale
      # information provided" (parseBrowserLanguages) before any test can run.
      # --web-results-dir must be absolute: patrol hands it to Playwright as is,
      # and Playwright resolves a relative path against its own config dir inside
      # the pub cache, where the video upload below would never find it.
      # --web-timeout is Playwright's per-test cap, 10 min by default. Every file
      # here is ONE Patrol test, and driver_advance's already ran 9m39s without
      # video, so recording would push it over. 20 min, still inside the job's 40.
      # app_dir / base_href default to wondermove_web, which prod serves at /new/;
      # the wondermake leg overrides both (prod serves it at /make/).
      - name: Patrol ${{ matrix.name }} (UI)
        working-directory: ${{ matrix.app_dir || 'flutter/apps/wondermove_web' }}
        env:
          LANG: en_US.UTF-8
          LANGUAGE: en_US:en
          LC_ALL: en_US.UTF-8
        run: |
          sed -i 's#<base href="${{ matrix.base_href || '/new/' }}">#<base href="/">#' web/index.html
          flutter pub get
          export CHROME_EXECUTABLE="$(find "$HOME/.cache/ms-playwright" -name chrome -path '*chrome-linux*' | head -1)"
          PATROL_ANALYTICS_ENABLED=false patrol test -d chrome \
            --target ${{ matrix.target }} \
            --web-port 3005 \
            --dart-define=ENV=local --dart-define=E2E=true \
            "--dart-define=ND_RUN=$ND_RUN" "--dart-define=MK_RUN=$MK_RUN" \
            "--dart-define=TR_RUN=$TR_RUN" "--dart-define=TB_RUN=$TB_RUN" \
            "--dart-define=TP_RUN=$TP_RUN" "--dart-define=LV_RUN=$LV_RUN" \
            "--dart-define=DO_RUN=$DO_RUN" "--dart-define=CT_RUN=$CT_RUN" \
            "--dart-define=MH_RUN=$MH_RUN" \
            --web-headless true --web-server-timeout 600 \
            --web-video ${{ matrix.video }} --web-results-dir "$PWD/test-results" \
            --web-timeout 1200000 \
            ${{ matrix.extra_args }} \
            --web-browser-args '["--no-sandbox","--enable-unsafe-swiftshader","--lang=en-US","--accept-lang=en-US"]' \
            --verbose

      - name: Upload Patrol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.report_name }}
          path: ${{ matrix.app_dir || 'flutter/apps/wondermove_web' }}/playwright-report
          if-no-files-found: ignore

      # One video.webm per Patrol test, under test-results/<test>/. A missing
      # video only warns: it is a debugging aid, and this job gates deploy_prod.
      - name: Upload Patrol video
        if: always() && matrix.video != 'off'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-video
          path: ${{ matrix.app_dir || 'flutter/apps/wondermove_web' }}/test-results/**/*.webm
          if-no-files-found: warn

      - name: Dump container logs on failure
        if: failure()
        run: |
          SERVICES="backend nginx kratos"
          if [ "${{ matrix.needs_mock }}" = "true" ]; then
            SERVICES="$SERVICES mock-server"
          fi
          docker compose $COMPOSE_FILES -p $PROJECT logs --tail 300 $SERVICES || true

      - name: Tear down
        if: always()
        run: docker compose $COMPOSE_FILES -p $PROJECT down -v

  # ---------------------------------------------------------------------------
  # Suites: every functional-test/suites/<suite>.json with "app": "web" in the
  # wonderWhy ref under test (grouped into legs by the plan job above). Suites
  # that share a "leg" run on one stack, each seeded in turn, then one Patrol
  # build runs all their tests. A new suite needs no edit here: file format and
  # grouping are in .github/actions/e2e_suites/e2e_suites.sh. With no web suite
  # picked the job is skipped.
  suites:
    needs: plan
    if: needs.plan.outputs.has_legs == 'true'
    # Same pin and reason as the journey job above (playwright on 26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    name: Web E2E Suite (${{ matrix.leg }})
    env:
      COMPOSE_FILES: >-
        ${{ matrix.mock && '-f compose.yml -f compose.local.yml -f compose.mock.yml'
                        || '-f compose.yml -f compose.local.yml' }}
      PROJECT: suite-${{ matrix.leg }}
      # Same as the journey job: single-tenant runner, nginx on 80, db on 15432.
      WEB_PORT: 80
      DB_PORT: 15432
    steps:
      - name: Checkout wonderWhy (code + compose live here)
        uses: actions/checkout@v5
        with:
          repository: WonderWhyDev/wonderWhy
          token: ${{ secrets.REPO_READ_TOKEN }}
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      # Node 22 for `npx playwright install` only; see the journey job.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate Patrol CLI
        run: dart pub global activate patrol_cli 4.7.0

      - name: Bring up the stack (mock overlay ${{ matrix.mock }})
        env:
          MOCK: ${{ matrix.mock }}
        run: |
          EXTRA=""
          if [ "$MOCK" = "true" ]; then EXTRA="mailpit"; fi
          docker compose $COMPOSE_FILES -p $PROJECT up -d --wait db localstack $EXTRA
          docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
            awslocal sqs create-queue --queue-name margin
          docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
            awslocal sqs create-queue --queue-name gl_posting_dlq.fifo --attributes FifoQueue=true
          docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
            awslocal sqs create-queue --queue-name gl_posting.fifo \
            --attributes FifoQueue=true,DeduplicationScope=messageGroup,FifoThroughputLimit=perMessageGroupId
          if [ "$MOCK" = "true" ]; then
            docker compose $COMPOSE_FILES -p $PROJECT exec -T localstack \
              awslocal s3 mb s3://localbucket
            docker compose $COMPOSE_FILES -p $PROJECT up -d --build \
              kratos backend mock-server nginx
          else
            docker compose $COMPOSE_FILES -p $PROJECT up -d --build \
              kratos backend nginx
          fi

      - name: Wait for backend
        working-directory: functional-test
        env:
          BACKEND_URL: http://localhost:${{ env.WEB_PORT }}/api
        run: ./bin/wait-for-backend.sh

      # One run id for the whole leg: the seeds name their rows after it and
      # the tests rebuild the same names. Each suite also puts its own prefix
      # in every name, since the leg's suites share this stack.
      - name: Fix the run id (E2E_RUN)
        run: echo "E2E_RUN=$(date +%s)" >> "$GITHUB_ENV"

      # Same pattern as the journey's seed step (the Dart VM does not exit
      # after the seed commits), once per suite, in file order. The marker
      # "[seed-<suite>] done" is each seed's verdict.
      - name: Seed the leg's suites (${{ matrix.suites }})
        working-directory: functional-test
        env:
          SEEDS: ${{ matrix.seeds }}
          BACKEND_URL: http://localhost:${{ env.WEB_PORT }}/api
          KRATOS_ADMIN_URL: http://localhost:${{ env.WEB_PORT }}/auth/api/admin
          KRATOS_PUBLIC_URL: http://localhost:${{ env.WEB_PORT }}/auth/api/public
          DB_HOST: localhost
        run: |
          set +e
          dart pub get || exit 1
          for pair in $SEEDS; do
            name=${pair%%=*}
            seed=${pair#*=}
            log=/tmp/seed-$name.log
            echo "::group::seed $name ($seed, E2E_RUN=$E2E_RUN)"
            dart run "$seed" > "$log" 2>&1 &
            pid=$!
            for i in $(seq 1 120); do
              grep -q "seed-$name] done" "$log" && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 2
            done
            cat "$log"
            kill "$pid" 2>/dev/null
            pkill -f "$seed" 2>/dev/null || true
            echo "::endgroup::"
            if ! grep -q "seed-$name] done" "$log"; then
              echo "::error::seed $name never printed [seed-$name] done"
              exit 1
            fi
          done

      - name: Install Playwright Chromium (match patrol web_runner)
        timeout-minutes: 10
        run: npx --yes playwright@1.56.0 install chromium

      # Flags as in the journey job. Video only for a failing test.
      # --web-timeout: 15 min per test file; a suite is meant to take 5-10.
      - name: Patrol leg ${{ matrix.leg }} (UI)
        working-directory: flutter/apps/wondermove_web
        env:
          LANG: en_US.UTF-8
          LANGUAGE: en_US:en
          LC_ALL: en_US.UTF-8
          TARGETS: ${{ matrix.targets }}
          SUITE_TZ: ${{ matrix.timezone }}
        run: |
          sed -i 's#<base href="/new/">#<base href="/">#' web/index.html
          flutter pub get
          export CHROME_EXECUTABLE="$(find "$HOME/.cache/ms-playwright" -name chrome -path '*chrome-linux*' | head -1)"
          TZ_ARGS=""
          if [ -n "$SUITE_TZ" ]; then TZ_ARGS="--web-timezone $SUITE_TZ"; fi
          PATROL_ANALYTICS_ENABLED=false patrol test -d chrome \
            --target "$TARGETS" \
            --web-port 3005 \
            --dart-define=ENV=local --dart-define=E2E=true \
            "--dart-define=E2E_RUN=$E2E_RUN" \
            --web-headless true --web-server-timeout 600 \
            --web-video retain-on-failure --web-results-dir "$PWD/test-results" \
            --web-timeout 900000 \
            $TZ_ARGS \
            --web-browser-args '["--no-sandbox","--enable-unsafe-swiftshader","--lang=en-US","--accept-lang=en-US"]' \
            --verbose

      - name: Upload Patrol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.leg }}-report
          path: flutter/apps/wondermove_web/playwright-report
          if-no-files-found: ignore

      - name: Upload Patrol video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.leg }}-video
          path: flutter/apps/wondermove_web/test-results/**/*.webm
          if-no-files-found: ignore

      - name: Dump container logs on failure
        if: failure()
        env:
          MOCK: ${{ matrix.mock }}
        run: |
          SERVICES="backend nginx kratos"
          if [ "$MOCK" = "true" ]; then SERVICES="$SERVICES mock-server"; fi
          docker compose $COMPOSE_FILES -p $PROJECT logs --tail 300 $SERVICES || true

      - name: Tear down
        if: always()
        run: docker compose $COMPOSE_FILES -p $PROJECT down -v
